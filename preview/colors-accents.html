<!doctype html>
<!-- @dsCard group="Colors" name="Interactive accents" subtitle="#007FEE · #00ADEE · #EE9300 — hover/focus only" viewport="700x280" -->
<html data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="_shared.css"></head>
<body><div class="card">
  <div class="label-row"><div class="eyebrow">Interactive accents</div><div class="meta">hover · focus · motion only — never static fills</div></div>
  <div class="row">
    <div class="swatch dark" style="background:#007fee;min-height:90px">
      <span class="name">accent-primary</span><span class="hex">#007FEE · WRLD blue · default hover/focus</span>
    </div>
    <div class="swatch dark" style="background:#00adee;min-height:90px">
      <span class="name">accent-secondary</span><span class="hex">#00ADEE · sky · gradient companion</span>
    </div>
    <div class="swatch dark" style="background:#EE9300;min-height:90px">
      <span class="name">accent-warm</span><span class="hex">#EE9300 · commerce / sales CTA</span>
    </div>
  </div>
  <div class="swatch dark" style="background:linear-gradient(90deg,#007fee 0%,#00adee 50%,#EE9300 100%);min-height:48px">
    <span class="name">--accent-gradient</span><span class="hex">motion sweeps only — never as a static fill</span>
  </div>
</div></body></html>
