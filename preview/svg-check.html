<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SVG check</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
<style>body{font-family:sans-serif;display:grid;gap:24px;padding:24px;background:#eee}
.row{display:flex;gap:24px;align-items:center}
.cell{padding:16px;border-radius:8px;background:#fff}
.cell.dark{background:#0a0a0a}
img{display:block}</style></head><body>
<div class="row">
  <div class="cell"><img src="../assets/logos/svg/wrld-mark-dark.svg" width="120"></div>
  <div class="cell dark"><img src="../assets/logos/svg/wrld-mark-light.svg" width="120"></div>
  <div class="cell"><img src="../assets/logos/wrld-mark-black.png" width="120" title="PNG reference"></div>
</div>
<div class="row">
  <div class="cell"><img src="../assets/logos/svg/wrld-lockup-dark.svg" width="380"></div>
  <div class="cell dark"><img src="../assets/logos/svg/wrld-lockup-light.svg" width="380"></div>
</div>
<div class="row">
  <div class="cell"><img src="../assets/logos/svg/wrld-tech-dark.svg" width="500"></div>
  <div class="cell dark"><img src="../assets/logos/svg/wrld-tech-light.svg" width="500"></div>
</div>
<div class="row">
  <div class="cell"><img src="../assets/logos/wrld-tech-black.png" width="500" title="PNG reference"></div>
</div>
</body></html>
