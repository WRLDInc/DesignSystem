<!doctype html>
<!-- @dsCard group="Brand" name="Starburst mark" subtitle="hero ornament + favicon scales" viewport="700x160" -->
<html data-theme="light">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="_shared.css"></head>
<body>
<div class="card">
  <div class="label-row">
    <div class="eyebrow">Starburst mark</div>
    <div class="meta">favicon · hero ornament · always paired with wordmark unless small-scale</div>
  </div>
  <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:14px;align-items:end;justify-items:center">
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><img src="../assets/logos/wrld-mark-black.png" style="width:80px;height:80px;object-fit:contain"/><span style="font-family:var(--font-mono);font-size:10px;color:var(--fg-muted)">80px</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><img src="../assets/logos/wrld-mark-black.png" style="width:48px;height:48px;object-fit:contain"/><span style="font-family:var(--font-mono);font-size:10px;color:var(--fg-muted)">48px</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><img src="../assets/logos/wrld-mark-black.png" style="width:32px;height:32px;object-fit:contain"/><span style="font-family:var(--font-mono);font-size:10px;color:var(--fg-muted)">32px</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><img src="../assets/logos/wrld-mark-black.png" style="width:24px;height:24px;object-fit:contain"/><span style="font-family:var(--font-mono);font-size:10px;color:var(--fg-muted)">24px</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><img src="../assets/logos/wrld-mark-black.png" style="width:16px;height:16px;object-fit:contain"/><span style="font-family:var(--font-mono);font-size:10px;color:var(--fg-muted)">16px</span></div>
  </div>
</div>
</body>
</html>
