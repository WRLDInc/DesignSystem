<!doctype html>
<!-- @dsCard group="Spacing" name="Radii" subtitle="prefer sharp / 4px" viewport="700x180" -->
<html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="_shared.css"></head>
<body><div class="card">
  <div class="label-row"><div class="eyebrow">Radii</div><div class="meta">prefer sharp / 4px — soft radii are off-brand</div></div>
  <div class="row">
    <div style="flex:1;height:96px;border:1px solid var(--border);border-radius:0;display:flex;align-items:center;justify-content:center;flex-direction:column;font-family:var(--font-mono);font-size:11px;background:var(--bg-subtle)"><b style="font-family:var(--font-body);font-size:13px">0</b><span style="color:var(--fg-muted)">sharp</span></div>
    <div style="flex:1;height:96px;border:1px solid var(--border);border-radius:4px;display:flex;align-items:center;justify-content:center;flex-direction:column;font-family:var(--font-mono);font-size:11px;background:var(--bg-subtle)"><b style="font-family:var(--font-body);font-size:13px">4</b><span style="color:var(--fg-muted)">inputs</span></div>
    <div style="flex:1;height:96px;border:1px solid var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-direction:column;font-family:var(--font-mono);font-size:11px;background:var(--bg-subtle)"><b style="font-family:var(--font-body);font-size:13px">8</b><span style="color:var(--fg-muted)">cards</span></div>
    <div style="flex:1;height:96px;border:1px solid var(--border);border-radius:12px;display:flex;align-items:center;justify-content:center;flex-direction:column;font-family:var(--font-mono);font-size:11px;background:var(--bg-subtle)"><b style="font-family:var(--font-body);font-size:13px">12</b><span style="color:var(--fg-muted)">modals</span></div>
    <div style="flex:1;height:96px;border:1px solid var(--border);border-radius:9999px;display:flex;align-items:center;justify-content:center;flex-direction:column;font-family:var(--font-mono);font-size:11px;background:var(--bg-subtle)"><b style="font-family:var(--font-body);font-size:13px">∞</b><span style="color:var(--fg-muted)">pill</span></div>
  </div>
</div></body></html>
