<!doctype html>
<html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="_shared.css"></head>
<body><div class="card">
  <div class="label-row"><div class="eyebrow">Form inputs</div><div class="meta">4px radius · hairline border · accent focus ring</div></div>
  <div style="display:flex;flex-direction:column;gap:10px">
    <label style="display:flex;flex-direction:column;gap:4px">
      <span style="font-size:13px;color:var(--fg-muted);font-weight:500">Email</span>
      <input value="ridge@wrld.tech" style="padding:10px 12px;border:1px solid #d4d4d8;border-radius:4px;font-family:var(--font-body);font-size:14px;background:#fff" />
    </label>
    <label style="display:flex;flex-direction:column;gap:4px">
      <span style="font-size:13px;color:var(--fg-muted);font-weight:500">Domain (focused)</span>
      <input value="wrld.host" style="padding:10px 12px;border:1px solid #007fee;border-radius:4px;font-family:var(--font-body);font-size:14px;background:#fff;outline:3px solid rgb(0 127 238 / 0.28)" />
    </label>
    <label style="display:flex;flex-direction:column;gap:4px">
      <span style="font-size:13px;color:var(--fg-muted);font-weight:500">Notes</span>
      <textarea rows="2" style="padding:10px 12px;border:1px solid #d4d4d8;border-radius:4px;font-family:var(--font-body);font-size:14px;background:#fff;resize:none">Discovery call scheduled for Tuesday.</textarea>
    </label>
  </div>
</div></body></html>
