<!doctype html>
<html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="_shared.css"></head>
<body><div class="card">
  <div class="label-row"><div class="eyebrow">Semantic surfaces — light & dark</div><div class="meta">monochromatic by default</div></div>
  <div class="row" style="gap:0;border:1px solid var(--border);border-radius:6px;overflow:hidden">
    <div style="flex:1;background:#ffffff;padding:14px;border-right:1px solid #e4e4e7">
      <div style="color:#0a0a0a;font-weight:600;font-family:var(--font-display)">Light mode</div>
      <div style="color:#52525b;font-size:13px;margin-top:4px">bg · bg-subtle · fg · fg-muted</div>
      <div style="display:flex;gap:6px;margin-top:10px">
        <span style="width:24px;height:24px;background:#ffffff;border:1px solid #e4e4e7;border-radius:3px"></span>
        <span style="width:24px;height:24px;background:#fafafa;border:1px solid #e4e4e7;border-radius:3px"></span>
        <span style="width:24px;height:24px;background:#f4f4f5;border:1px solid #e4e4e7;border-radius:3px"></span>
        <span style="width:24px;height:24px;background:#0a0a0a;border-radius:3px"></span>
        <span style="width:24px;height:24px;background:#52525b;border-radius:3px"></span>
      </div>
    </div>
    <div style="flex:1;background:#0a0a0a;padding:14px">
      <div style="color:#fafafa;font-weight:600;font-family:var(--font-display)">Dark mode</div>
      <div style="color:#a1a1aa;font-size:13px;margin-top:4px">bg · bg-subtle · fg · fg-muted</div>
      <div style="display:flex;gap:6px;margin-top:10px">
        <span style="width:24px;height:24px;background:#0a0a0a;border:1px solid #27272a;border-radius:3px"></span>
        <span style="width:24px;height:24px;background:#18181b;border:1px solid #27272a;border-radius:3px"></span>
        <span style="width:24px;height:24px;background:#27272a;border-radius:3px"></span>
        <span style="width:24px;height:24px;background:#fafafa;border-radius:3px"></span>
        <span style="width:24px;height:24px;background:#a1a1aa;border-radius:3px"></span>
      </div>
    </div>
  </div>
</div></body></html>
