<!doctype html>
<!-- @dsCard group="Components" name="WRLD Help launcher" subtitle="warm accent · Gleap corner button representation" viewport="700x180" -->
<html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="_shared.css"></head>
<body><div class="card">
  <div class="label-row"><div class="eyebrow">WRLD Help launcher</div><div class="meta">warm #EE9300 · one of the few sanctioned static accent uses</div></div>
  <style>
    .help-demo { display: flex; align-items: center; gap: 28px; }
    .hb { position: relative; border: none; border-radius: 50%; background: #EE9300; color: #fff;
          display: grid; place-items: center; cursor: pointer; padding: 0;
          box-shadow: 0 10px 40px -8px rgb(238 147 0 / 0.22);
          transition: transform 200ms cubic-bezier(.2,.8,.2,1); }
    .hb:hover { transform: translateY(-1px) scale(1.05); }
    .hb-52 { width: 52px; height: 52px; }
    .hb-40 { width: 40px; height: 40px; }
    .hb-ring { position: absolute; inset: 0; border-radius: 50%;
               border: 1px solid rgb(238 147 0 / 0.55);
               animation: help-ping 2.8s cubic-bezier(.2,.8,.2,1) infinite; pointer-events: none; }
    @keyframes help-ping { 0% { transform: scale(1); opacity: .8; } 70%, 100% { transform: scale(1.5); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .hb-ring { animation: none; } }
    .help-note { font-family: var(--font-body); font-size: 12px; color: #52525b; max-width: 340px; line-height: 1.5; }
  </style>
  <div class="help-demo">
    <button class="hb hb-52" type="button" aria-label="Open WRLD Help chat">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/><path d="M9.8 9.3a2.3 2.3 0 0 1 4.5.7c0 1.5-2.3 2.1-2.3 2.1"/><path d="M12 15.4h.01"/>
      </svg>
      <span class="hb-ring" aria-hidden="true"></span>
    </button>
    <button class="hb hb-40" type="button" aria-label="Open WRLD Help chat">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/><path d="M9.8 9.3a2.3 2.3 0 0 1 4.5.7c0 1.5-2.3 2.1-2.3 2.1"/><path d="M12 15.4h.01"/>
      </svg>
      <span class="hb-ring" aria-hidden="true"></span>
    </button>
    <p class="help-note">The Gleap widget's corner launcher, as a reusable visual. 52px for menus and panels, 40px for cards. Ping ring pauses under reduced motion.</p>
  </div>
</div></body></html>
