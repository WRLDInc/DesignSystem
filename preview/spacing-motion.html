<!doctype html>
<!-- @dsCard group="Spacing" name="Motion" subtitle="durations + easing curves" viewport="700x210" -->
<html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="_shared.css"></head>
<body><div class="card">
  <div class="label-row"><div class="eyebrow">Motion</div><div class="meta">tight · precise · never bouncy</div></div>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;font-family:var(--font-mono);font-size:11px">
    <div style="padding:12px;border:1px solid var(--border);border-radius:6px"><b style="font-family:var(--font-body);font-size:14px;display:block;margin-bottom:4px">120ms</b><span style="color:var(--fg-muted)">micro</span></div>
    <div style="padding:12px;border:1px solid var(--border);border-radius:6px"><b style="font-family:var(--font-body);font-size:14px;display:block;margin-bottom:4px">200ms</b><span style="color:var(--fg-muted)">default</span></div>
    <div style="padding:12px;border:1px solid var(--border);border-radius:6px"><b style="font-family:var(--font-body);font-size:14px;display:block;margin-bottom:4px">320ms</b><span style="color:var(--fg-muted)">emphasis</span></div>
    <div style="padding:12px;border:1px solid var(--border);border-radius:6px"><b style="font-family:var(--font-body);font-size:14px;display:block;margin-bottom:4px">600ms</b><span style="color:var(--fg-muted)">reveal</span></div>
  </div>
  <div style="font-family:var(--font-mono);font-size:11px;color:var(--fg-muted);line-height:1.6">
    standard <code>cubic-bezier(.2,.8,.2,1)</code><br>
    enter <code>cubic-bezier(.4,0,.2,1)</code> · exit <code>cubic-bezier(.4,0,1,1)</code> · precise <code>cubic-bezier(.83,0,.17,1)</code>
  </div>
</div></body></html>
