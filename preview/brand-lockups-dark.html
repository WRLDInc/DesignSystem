<!doctype html>
<!-- @dsCard group="Brand" name="Lockups · dark" subtitle="light logo on dark surface" viewport="700x160" -->
<html data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_shared.css">
<style>
  body { background: #0a0a0a; }
  .lockup-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .lockup {
    background: #0a0a0a; border: 1px solid #27272a; border-radius: 8px;
    padding: 14px 16px; display: flex; align-items: center; gap: 2px; height: 72px;
  }
  .lockup img.mark { height: 40px; width: 40px; flex-shrink: 0; object-fit: contain; display: block; }
  .lockup .text {
    flex: 1; min-width: 0; display: flex; flex-direction: column;
    line-height: 1; padding-right: 4.2em;
  }
  .lockup .wordmark {
    font-family: 'Montserrat', sans-serif; font-weight: 700;
    font-size: 22px; letter-spacing: 0.04em; color: #fff;
  }
  .lockup .sub {
    font-family: 'Montserrat', sans-serif; font-weight: 500;
    font-size: 11px; letter-spacing: 0.18em; color: #a1a1aa;
    margin-top: 4px; text-transform: uppercase;
  }
  .lockup.parent .wordmark { font-size: 24px; }
</style>
</head>
<body>
<div class="card" style="background:transparent;border-color:#27272a">
  <div class="label-row">
    <div class="eyebrow" style="color:#a1a1aa">Logo on dark</div>
    <div class="meta" style="color:#a1a1aa">light mark on dark bg · dark mark on light bg, always</div>
  </div>
  <div class="lockup-grid">
    <div class="lockup parent">
      <img class="mark" src="../assets/logos/wrld-mark-white.png" alt="WRLD">
      <div class="text"><div class="wordmark">WRLD</div></div>
    </div>
    <div class="lockup">
      <img class="mark" src="../assets/logos/wrld-mark-white.png" alt="">
      <div class="text"><div class="wordmark">WRLD</div><div class="sub">TECH</div></div>
    </div>
    <div class="lockup">
      <img class="mark" src="../assets/logos/wrld-mark-white.png" alt="">
      <div class="text"><div class="wordmark">WRLD</div><div class="sub">AI</div></div>
    </div>
  </div>
</div>
</body>
</html>
