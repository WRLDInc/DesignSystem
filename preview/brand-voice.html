<!doctype html>
<!-- @dsCard group="Brand" name="Voice examples" subtitle="on-brand vs off-brand copy" viewport="700x280" -->

<body><div class="card">
  <div class="label-row"><div class="eyebrow">Voice · examples</div><div class="meta">on-brand vs off-brand</div></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:13px;line-height:1.55">
    <div style="border-left:2px solid #0a0a0a;padding:10px 14px;background:#fafafa">

    <div style="border-left:2px solid #ef4444;padding:10px 14px;background:#fef2f2">

      "We're the BEST IT company in Dallas! 🚀"

      "We detected an SSL renewal issue and rotated the cert."
    </div>
    <div style="border-left:2px solid #ef4444;padding:10px 14px;background:#fef2f2">
      <div style="font-family:var(--font-mono);font-size:10px;color:#991b1b;letter-spacing:0.12em;text-transform:uppercase;margin-bottom:6px">Off-brand</div>
