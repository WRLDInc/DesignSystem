name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tokens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate design tokens are in sync
        run: node scripts/validate_tokens.mjs

  site:
    name: Build the wrld.design site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # scripts/build_site.mjs uses Node built-ins only, so there is nothing
      # to install. It fails if a published file references an asset the
      # allowlist did not copy, which is what makes this a useful gate:
      # editing PUBLISH or moving an asset can't silently break the site.
      - name: Assemble dist/ and verify every reference resolves
        run: node scripts/build_site.mjs

  logos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install rendering deps
        run: pip install pillow
      # The favicon pipeline renders from the authentic raster master only.
      # Byte-diffing PNGs across Pillow versions is fragile, so the gate is:
      # the pipeline runs, every published icon exists, and the retired
      # parametric outputs (favicon.svg, the logos/svg set) stay dead.
      - name: Render favicons and verify the published set
        run: |
          # Snapshot the committed set first: deploys publish the committed
          # files (npm run build never renders), so a contributor who edits
          # the master artwork but forgets to commit regenerated favicons
          # must fail here, at the pixel level.
          cp -r logos/favicons /tmp/committed-favicons
          python3 scripts/render_logo_pngs.py
          python3 scripts/check_favicons_fresh.py /tmp/committed-favicons logos/favicons
          for dir in logos/favicons assets/logos/favicons; do
            for f in favicon.ico favicon-16x16.png favicon-32x32.png \
                     apple-touch-icon.png android-chrome-192x192.png \
                     android-chrome-512x512.png site.webmanifest; do
              test -s "$dir/$f" || { echo "::error::missing $dir/$f"; exit 1; }
            done
            test ! -e "$dir/favicon.svg" || { echo "::error::parametric favicon.svg reappeared in $dir"; exit 1; }
          done
          test ! -d logos/svg || { echo "::error::retired logos/svg directory reappeared"; exit 1; }
          test ! -d assets/logos/svg || { echo "::error::retired assets/logos/svg directory reappeared"; exit 1; }
          ! grep -rl "logos/svg/\|favicon\.svg" --include="*.html" --include="*.webmanifest" \
              styleguide preview ui_kits deploy logos assets 2>/dev/null | grep . || {
            echo "::error::a published page still references the retired parametric set"; exit 1;
          }
