<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="x-apple-disable-message-reformatting">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<title>{$company_name}</title>
<!--[if mso]><noscript><xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml></noscript><![endif]-->

<!--[if !mso]><!-->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Ubuntu:wght@400;500;700&family=Ubuntu+Mono:wght@400;700&display=swap" rel="stylesheet" type="text/css">
<!--<![endif]-->
<style>
  :root { color-scheme: light dark; supported-color-schemes: light dark; }
  html, body { margin:0 !important; padding:0 !important; height:100% !important; width:100% !important; }
  * { -ms-text-size-adjust:100%; -webkit-text-size-adjust:100%; }
  table, td { mso-table-lspace:0pt !important; mso-table-rspace:0pt !important; border-collapse:collapse !important; }
  img { -ms-interpolation-mode:bicubic; border:0; outline:none; text-decoration:none; }
  a { text-decoration:none; }
  a[x-apple-data-detectors] { color:inherit !important; text-decoration:none !important; }
  .wrld-body p { margin:0 0 12px 0; }
  .wrld-body p:last-child { margin-bottom:0; }
  .wrld-body ul, .wrld-body ol { margin:0 0 12px 22px; padding:0; }
  .wrld-body pre, .wrld-body code { font-family:'Ubuntu Mono',Menlo,Consolas,monospace; font-size:13px; }
  .wrld-body img { max-width:100%; height:auto; }
  .wrld-body blockquote { margin:0 0 12px 0; padding:0 0 0 12px; border-left:2px solid #e4e4e7; color:#52525b; }
  /* History injected by platform tags. Syncro emits TWO divs per comment: a header div (name p with
     line-height 0, then a small date) and a body div. Both are reset, then one rule is drawn per comment. */
  .wrld-history .wrld-msg { border-top:1px solid #e4e4e7 !important; padding:14px 0 !important; margin:0 !important; }
  .wrld-history .wrld-msg:first-child { border-top:0 !important; padding-top:0 !important; }
  /* No child combinators anywhere in this sheet. Syncro HTML-escapes the greater-than sign inside the
     wrapper style block, which silently drops the whole rule. Syncro comment divs are matched by inline style. */
  .wrld-history-syncro div[style*="#ddd"] { border:0 !important; margin:0 !important; }
  .wrld-history-syncro div[style*="border-top: 1px #ddd"] { border-top:1px solid #e4e4e7 !important; padding:14px 0 0 0 !important; }
  .wrld-history-syncro div[style*="border-bottom: 1px #ddd"] { padding:6px 0 14px 0 !important; }
  .wrld-history-syncro div:first-child[style*="border-top: 1px #ddd"] { border-top:0 !important; padding-top:0 !important; }
  .wrld-history p { margin:0 0 8px 0 !important; line-height:1.5 !important; color:#52525b; }
  .wrld-history p[style*="font-weight:600"], .wrld-history p[style*="font-weight: 600"] { line-height:1.4 !important; color:#18181b !important; font-size:13px; margin:0 0 2px 0 !important; }
  .wrld-history small { display:block; font-size:12px; line-height:16px; color:#71717a !important; }
  .wrld-history blockquote { margin:0 0 8px 0; padding:0 0 0 12px; border-left:2px solid #e4e4e7; }
  .wrld-history img { max-width:100%; height:auto; }
  .wrld-history hr { display:none; }
  @media only screen and (max-width: 620px) {
    .container { width:100% !important; max-width:100% !important; }
    .px { padding-left:16px !important; padding-right:16px !important; }
    .stack { display:block !important; width:100% !important; }
    .stack-gap { padding-top:8px !important; }
    .right-on-desktop { text-align:left !important; }
    .hide-sm { display:none !important; max-height:0 !important; overflow:hidden !important; }
    .btn-full { display:block !important; width:100% !important; text-align:center !important; box-sizing:border-box !important; }
    .h1 { font-size:22px !important; line-height:28px !important; }
    .meta-k { width:96px !important; }
  }
  @media (prefers-color-scheme: dark) {
    .bg-page { background-color:#0a0a0a !important; }
    .bg-card { background-color:#18181b !important; border-color:#27272a !important; }
    .bg-band { background-color:#18181b !important; }
    .bg-muted { background-color:#27272a !important; }
    .fg, .fg a, .h1, .wrld-body, .wrld-body p, .wrld-body li { color:#fafafa !important; }
    .fg-muted, .fg-muted a, .wrld-history p { color:#a1a1aa !important; }
    .fg-subtle { color:#71717a !important; }
    .rule, .wrld-history .wrld-msg, .wrld-history blockquote, .wrld-history-syncro div[style*="border-top: 1px #ddd"] { border-color:#27272a !important; }
    .wrld-history small { color:#71717a !important; }
    .wrld-history p[style*="font-weight:600"], .wrld-history p[style*="font-weight: 600"] { color:#fafafa !important; }
    .btn { background-color:#fafafa !important; }
    .btn-a { color:#0a0a0a !important; }
    .btn-warm { background-color:#EE9300 !important; }
    .btn-a-warm { color:#0a0a0a !important; }
    .meta-k { border-color:#27272a !important; }
    .logo-light { display:none !important; }
    .logo-dark { display:block !important; max-height:none !important; }
    .chip { border-color:#3f3f46 !important; }
  }
  [data-ogsc] .bg-page { background-color:#0a0a0a !important; }
  [data-ogsc] .bg-card { background-color:#18181b !important; }
  [data-ogsc] .fg, [data-ogsc] .h1, [data-ogsc] .wrld-body p { color:#fafafa !important; }
  [data-ogsc] .fg-muted { color:#a1a1aa !important; }
  [data-ogsc] .logo-light { display:none !important; }
  [data-ogsc] .logo-dark { display:block !important; max-height:none !important; }
  [data-ogsc] .wrld-history p { color:#a1a1aa !important; }
  [data-ogsc] .wrld-history p[style*="font-weight:600"], [data-ogsc] .wrld-history p[style*="font-weight: 600"] { color:#fafafa !important; }
</style>
</head>
<body class="bg-page" style="margin:0;padding:0;width:100%;background-color:#f4f4f5;">

<center role="article" aria-roledescription="email" lang="en" style="width:100%;background-color:#f4f4f5;" class="bg-page">
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" class="bg-page" style="background-color:#f4f4f5;">
<tr><td align="center" style="padding:24px 12px;">
