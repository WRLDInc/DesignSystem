<!doctype html>
<!-- @dsCard group="UI Kit — Shared" name="Lockup" subtitle="canonical mark + wordmark + optional sub-brand label" viewport="700x300" -->
<html data-theme="light">
<head>
<meta charset="utf-8">
<title>Lockup — shared component</title>
<link rel="icon" href="../../assets/logos/favicons/favicon-32x32.png">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body style="margin:0;">
<div id="root"></div>
<script type="text/babel">
  const { Lockup } = window.WRLDTechDesignSystemRemix_6276ea;
  function Cell({ label, dark, children }) {
    return (
      <div style={{
        display: 'flex', flexDirection: 'column', gap: 16, padding: '28px 32px',
        background: dark ? 'var(--mono-950)' : 'var(--bg)',
        borderRight: '1px solid var(--border)', flex: 1,
      }}>
        <span style={{
          fontFamily: 'var(--font-body)', fontSize: 11, fontWeight: 500,
          letterSpacing: '0.16em', textTransform: 'uppercase',
          color: dark ? 'var(--mono-400)' : 'var(--fg-muted)',
        }}>{label}</span>
        <div style={{ display: 'flex', alignItems: 'center', flex: 1 }}>{children}</div>
      </div>
    );
  }
  function App() {
    return (
      <div data-screen-label="Lockup component" style={{ display: 'flex', minHeight: 300, borderBottom: '1px solid var(--border)' }}>
        <Cell label="Mark + wordmark">
          <Lockup theme="dark" size={26} />
        </Cell>
        <Cell label="With sub-brand">
          <Lockup theme="dark" size={26} sub="TECH" />
        </Cell>
        <Cell label="On dark surface" dark>
          <Lockup theme="light" size={26} sub="AI" />
        </Cell>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
